# HTTP-only mode — used when no TLS certificate is mounted.
#
# This is the original behaviour and is fine for localhost development. It is NOT enough for a LAN
# deployment where people open the app by IP: the browser only grants microphone access on a
# "secure context", and http://<ip> is not one — the AI Assistant's voice button fails there with
# `not-allowed` before the permission prompt even appears. Run scripts/gen-lan-cert.sh to switch
# the container into the HTTPS mode next door.

server {
  listen 80;
  server_name _;

  include /etc/nginx/snippets/common.conf;
}
