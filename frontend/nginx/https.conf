# HTTPS mode — selected automatically by docker-entrypoint.sh when a certificate is mounted at
# /etc/nginx/certs. See the HTTPS section of README.md for how to generate one and trust it on the client machines.
#
# WHY THIS EXISTS: the AI Assistant's microphone uses the Web Speech API, and browsers only expose
# it (like every other powerful API) on a SECURE CONTEXT. `localhost` counts as one by spec, which
# is why voice works while developing and stops the moment the app is opened by IP over HTTP —
# Chrome rejects it with `not-allowed` without ever showing the permission prompt.

# ── Port 80 → redirect everything to HTTPS ────────────────────────
# Keeps every existing bookmark and shortcut working, and means nobody can end up on the insecure
# origin by accident and hit the voice failure again.
server {
  listen 80;
  server_name _;

  # The ACME path is left on HTTP on purpose: if this deployment ever moves to a real certificate
  # from an internal CA or Let's Encrypt (DNS-01 is not needed for HTTP-01), the challenge must not
  # be redirected away.
  location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }

  location / {
    # __PORT_SUFFIX__ is filled in by docker-entrypoint.sh. $host does NOT carry a port, and this
    # deployment publishes 443 as 5443 on the host — without the suffix every redirect landed on
    # https://<ip>/ (port 443), which nothing is listening on.
    return 308 https://$host__PORT_SUFFIX__$request_uri;
  }
}

# ── Port 443 — the real server ────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # TLS 1.2 is kept for older managed browsers on the LAN; 1.0/1.1 are not offered at all.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # HSTS is deliberately NOT set. On a LAN reached by IP it would pin every browser to HTTPS for
  # this address permanently — including after someone rebuilds the VM without a certificate — and
  # an IP-based HSTS entry is painful to clear across a fleet.

  include /etc/nginx/snippets/common.conf;
}
