# Shared server body — included by BOTH nginx.http.conf and nginx.https.conf so the app behaves
# identically whichever one the entrypoint picks. Only the `listen` lines differ between them.

root /usr/share/nginx/html;
index index.html;

# ── Gzip compression (ลดขนาด response — โหลดเร็วขึ้น) ──────────────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain text/css application/json application/javascript
  text/javascript application/xml application/xml+rss
  image/svg+xml font/woff font/woff2;

# ── Security headers (server-level) ───────────────────────────────
# ใช้ expires (ไม่ใช่ add_header Cache-Control) ใน location เพื่อไม่ให้
# nginx ตัด add_header เหล่านี้ทิ้ง (add_header ไม่ inherit ถ้า location มี add_header เอง)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;

# The version in the Server header. nginx sends "nginx/1.30.7" by default, and a scanner only has
# to read it to know which published advisories to go and look up — ZAP's rule 20020 is literally
# that lookup, and it is how a stale base image gets found from outside with no access at all.
# `off` leaves a bare "nginx", which is as much as a client ever needs to know. This hides the
# number; it does not patch anything, which is why the base image was bumped in the same change.
server_tokens off;

# ── Permissions-Policy ────────────────────────────────────────────
# Turns off the device APIs this console has no business touching, for the page and for anything
# it ever embeds. Each one left out of this list keeps the browser default (`self`), so this names
# only what is DENIED — writing a full allow-list here would mean silently revoking the defaults of
# every feature nobody thought to mention.
#
# `microphone` is NOT in the list, and that is the load-bearing part: the AI Assistant's dictation
# button is the Web Speech API (pages/ai-assistant/useVoiceInput.ts), which Chrome gates on the
# microphone permission. `microphone=()` here would break voice on every browser — silently, since
# the page would simply never get a permission prompt. Same reason `clipboard-write` is absent:
# nine pages copy to the clipboard. geolocation goes: Trace Route's hop locations are looked up
# server-side from GeoLite2, never from the viewer's device.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# ── Cross-origin isolation (the half of ZAP rule 90004 that is free) ──
# COOP severs window.opener for anything this page opens or that opens it, so a tab opened from
# here — the links out to docs.fortinet.com are the only ones — cannot reach back and navigate the
# console. CORP stops another origin from embedding what this server serves.
#
# COEP ('require-corp') is deliberately NOT set, although ZAP asks for all three. It only buys
# cross-origin isolation, which exists to unlock SharedArrayBuffer, and nothing here uses it —
# while it blocks every subresource that does not carry CORP, including the ones the 3D topology
# view builds at runtime. Setting a header to quiet a scanner, and finding out later which page it
# broke, is the trade this file keeps refusing to make.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# ── Content-Security-Policy ───────────────────────────────────────
# The header that decides what the page is ALLOWED to load, and the one this deployment did not
# have. Without it, any string this console renders from the firewall — a policy comment, an
# address object's name, a log line, an AI answer — is one escaping mistake away from executing.
# React escapes text by default, which is why that has not happened; a CSP is the second lock, so
# that a single missed `dangerouslySetInnerHTML` is a broken image rather than a session.
#
# Every source below was derived from what the app actually does, not copied from a template:
#
#   default-src 'self'   everything the build emits is same-origin; there is no CDN.
#   script-src  'self'   the Vite build has no inline script and index.html has none either, so
#                        this needs no 'unsafe-inline' — which is the whole value of the header.
#   style-src   + 'unsafe-inline'
#                        1,161 `style={{…}}` attributes across the pages, plus the accent colour
#                        the theme writes inline. CSP3's style-src-attr would be the precise tool
#                        but is not carried consistently; an injected STYLE cannot run code, so
#                        this is the trade that keeps script-src strict.
#   img-src     + data: blob:
#                        avatars are base64 columns, and several downloads build object URLs.
#   font-src    'self' data:
#                        @fontsource is bundled, and Vite INLINES the woff2 as data: URIs — which
#                        is what "no request" in the note at the top of src/index.css means. A
#                        first CSP without this shipped a console with no typefaces; the browser
#                        said so immediately, which is why this was tried against a real page
#                        rather than reasoned about.
#   connect-src 'self'   the API, SSE (/api/events) and all three WebSockets are same-origin;
#                        'self' covers ws:/wss: to the same host under CSP3.
#   object-src  'none'   no plugins, ever.
#   base-uri    'self'   an injected <base> would re-point every relative URL on the page.
#   frame-ancestors      the modern X-Frame-Options; both are sent because old browsers read only
#                        the latter and new ones prefer the former.
#   form-action 'self'   nothing here posts to another origin.
#
# Links out to docs.fortinet.com are navigations, not loads, and are unaffected.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

# ── The worker's own callbacks are not part of the public surface ─
# The backend registers POST /internal/jobs/… and /internal/config-deploys/… for the Python worker
# to report job results on. The worker reaches the backend DIRECTLY (BACKEND_URL=http://backend:9000
# on the compose network), so nothing legitimate ever arrives here — but because the block below
# strips the /api/ prefix, /api/internal/… WOULD reach them from the LAN. They authenticate with
# X-Worker-Secret and have always checked it; this simply takes them off the public surface, so a
# weakness in that check is not also an exposure.
#
# 404, not 403: whether an endpoint exists is not something a stranger needs to learn.
location ^~ /api/internal/ {
  return 404;
}

# ── WebSocket: the Config Deploy terminal ─────────────────────────
# A separate location, ahead of the general /api/ one, because the two need OPPOSITE values for
# the same header. The API block sets `Connection ""` so Server-Sent Events (/api/events, the AI
# stream) are not buffered or kept alive as a pooled connection — but a WebSocket handshake is
# exactly `Connection: upgrade`, so sending an empty Connection there makes nginx answer the
# upgrade with a plain 200 and the socket never forms.
#
# Scoping it to this one path keeps SSE untouched, and means no `map` directive — which would
# have to live in the http context and cannot, since this file is included inside `server`.
location ^~ /api/terminal/ {
  proxy_pass http://backend:9000/terminal/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # The authority the BROWSER addressed, port included. `Host $host` above drops the port
  # ($host is the host NAME), and services.BrowserOriginAllowed compares the Origin header —
  # which always carries the port — against it. Without this line a console opened on
  # http://<lan-ip>:5173 sent Origin "http://<lan-ip>:5173" while the backend saw host
  # "<lan-ip>", the two did not match, and every WebSocket upgrade from the LAN was refused 403:
  # the terminal and the diagnostics stream both, with only http://localhost:5173 still working
  # because that one string is the built-in dev default. Host is left as $host so nothing else
  # changes behaviour. See services.BrowserRequestHost for why trusting this header costs nothing.
  proxy_set_header X-Forwarded-Host $http_host;
  # A replayed change request carries X-Internal-Apply* (services/changerequest_apply.go), and
  # middleware/authorization.go reads the user id, email and role from those headers when the
  # process-local secret matches. The secret is random per boot and compared in constant time, so
  # forging it from outside is not the concern — the concern is that a header which can grant an
  # identity should never be something the outside world is even able to send. Clearing them here
  # means the only sender is this backend talking to itself.
  proxy_set_header X-Internal-Apply "";
  proxy_set_header X-Internal-Apply-User "";
  proxy_set_header X-Internal-Apply-Email "";
  proxy_set_header X-Internal-Apply-Role "";
  proxy_buffering off;
  # An interactive shell is idle for long stretches while someone reads output. The backend pings
  # every 25 s, so this only has to outlast that comfortably.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# ── WebSocket: live ping / traceroute ─────────────────────────────
# Second upgrade location, for the same reason as the terminal one above: `Connection: upgrade` is
# required for the handshake and would break SSE for everything else if it were set on /api/.
#
# The timeouts are much shorter than the terminal's — a diagnostic is bounded work (traceroute is
# capped at 100 s in the backend), not a shell someone leaves open while they read. 180 s gives the
# longest run comfortable room and still reaps an abandoned socket promptly.
location ^~ /api/diag-stream/ {
  proxy_pass http://backend:9000/diag-stream/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Port included, unlike $host — see the note on the terminal location above.
  proxy_set_header X-Forwarded-Host $http_host;
  # A replayed change request carries X-Internal-Apply* (services/changerequest_apply.go), and
  # middleware/authorization.go reads the user id, email and role from those headers when the
  # process-local secret matches. The secret is random per boot and compared in constant time, so
  # forging it from outside is not the concern — the concern is that a header which can grant an
  # identity should never be something the outside world is even able to send. Clearing them here
  # means the only sender is this backend talking to itself.
  proxy_set_header X-Internal-Apply "";
  proxy_set_header X-Internal-Apply-User "";
  proxy_set_header X-Internal-Apply-Email "";
  proxy_set_header X-Internal-Apply-Role "";
  proxy_buffering off;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
}

# ── Reverse proxy: API → backend (same-origin) ────────────────────
# ทำให้ frontend เรียก /api/* แทน http://localhost:9000 → เปิดจาก host ไหน
# ก็เร็วเท่ากัน ไม่ต้องพึ่ง port-forward 9000 และไม่ติด CORS
location ^~ /api/ {
  proxy_pass http://backend:9000/;   # trailing slash = ตัด /api/ ออก
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # $scheme is "https" when this include is used from nginx.https.conf, so the backend sees the
  # real protocol and any redirect/cookie it builds stays on HTTPS.
  proxy_set_header X-Forwarded-Proto $scheme;
  # Port included, unlike $host — see the note on the terminal location above.
  proxy_set_header X-Forwarded-Host $http_host;
  # A replayed change request carries X-Internal-Apply* (services/changerequest_apply.go), and
  # middleware/authorization.go reads the user id, email and role from those headers when the
  # process-local secret matches. The secret is random per boot and compared in constant time, so
  # forging it from outside is not the concern — the concern is that a header which can grant an
  # identity should never be something the outside world is even able to send. Clearing them here
  # means the only sender is this backend talking to itself.
  proxy_set_header X-Internal-Apply "";
  proxy_set_header X-Internal-Apply-User "";
  proxy_set_header X-Internal-Apply-Email "";
  proxy_set_header X-Internal-Apply-Role "";
  # รองรับ SSE (/api/events) — ปิด buffer + timeout ยาว
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
}

# SPA fallback — ทุก route ที่ไม่ใช่ไฟล์จริงให้ส่ง index.html
location / {
  try_files $uri $uri/ /index.html;
}

# static assets — cache ยาว (ไฟล์ build มี hash ในชื่ออยู่แล้ว)
location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
  try_files $uri =404;
  expires 7d;
}

# index.html ห้าม cache (จะได้เห็น deploy ใหม่ทันที)
location = /index.html {
  expires -1;
}
